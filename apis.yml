name: Zimbra
description: >-
  Zimbra is an open-source email and collaboration platform serving more than 200 million
  users worldwide, offering email, calendar, contacts, tasks, group chat, file storage
  (Briefcase), and an in-browser office suite. It is deployed self-hosted (on-premises,
  private cloud, or regional data center) to give organizations full data sovereignty over
  their communications. Zimbra's programmatic surface is a SOAP API (account, mail, and
  admin namespaces) wrapped by a first-party GraphQL/JavaScript client (@zimbra/api-client);
  it also speaks the IMAP, POP3, SMTP, CalDAV, CardDAV, and Exchange ActiveSync standards.
  There is no public OpenAPI/REST contract. Backed by Redpoint Ventures; added to the API
  Evangelist network from a VC-portfolio lead and enriched from Zimbra's public developer
  surface.
